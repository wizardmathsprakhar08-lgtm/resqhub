services:
  - type: web
    name: resqhub-portal
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: PROJECT_NAME
        value: "ResQHub Emergency Platform"
      - key: API_V1_STR
        value: "/api/v1"
      - key: MOCK_SMS_PROVIDER
        value: "true"
      - key: ALLOWED_ORIGINS
        value: "*"
